version: '3.8'

services:
  # 🚀 FastAPI POS Backend Service
  pos_backend:
    build: .
    container_name: pos_fastapi_backend
    ports:
      - "8002:8000"
    env_file:
      - .env  # โหลดตัวแปรทั้งหมดจากไฟล์ .env เข้า Container
    environment:
      - DATABASE_URL=postgresql://postgres.mnnlcxyjiajvxffjkedl:admin-pos-db@aws-0-ap-southeast-1.pooler.supabase.com:6543/postgres
      - JWT_SECRET_KEY=supersecretkey
    volumes:
      - .:/app
    depends_on:
      - pos_redis_cache

  # ⚡ Redis Cache (ยังเก็บไว้ใช้งานระบบแคชตามปกติ)
  pos_redis_cache:
    image: redis:7-alpine
    container_name: pos_redis_cache
    ports:
      - "6380:6379"